<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossieres de operaciones · CdU de 0 a ÉXITO</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap');

  :root{
    --navy:#163D60;
    --ochre:#E29F34;
    --cream:#FDFBF7;
  }

  *{box-sizing:border-box}

  body{
    margin:0;
    font-family:'Montserrat',Arial,sans-serif;
    background:var(--cream);
    color:var(--navy);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    background:var(--navy);
    color:var(--cream);
    padding:56px 24px 44px;
    text-align:center;
  }

  header .eyebrow{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ochre);
    border:1px solid rgba(226,159,52,.5);
    border-radius:30px;
    padding:6px 16px;
    margin-bottom:18px;
  }

  header h1{
    margin:0;
    font-size:clamp(24px,4vw,36px);
    font-weight:800;
    letter-spacing:.2px;
  }

  header p{
    margin:14px auto 0;
    max-width:520px;
    font-size:14.5px;
    line-height:1.6;
    color:rgba(253,251,247,.78);
  }

  main{
    flex:1;
    max-width:760px;
    width:100%;
    margin:0 auto;
    padding:48px 24px 64px;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    background:#fff;
    border:1px solid rgba(22,61,96,.12);
    border-radius:14px;
    padding:22px 26px;
    text-decoration:none;
    color:var(--navy);
    box-shadow:0 4px 16px rgba(22,61,96,.06);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }

  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 28px rgba(22,61,96,.14);
    border-color:rgba(226,159,52,.5);
  }

  .card-title{
    font-weight:700;
    font-size:17px;
    margin:0 0 4px;
  }

  .card-sub{
    margin:0;
    font-size:12.5px;
    color:rgba(22,61,96,.6);
    font-weight:400;
  }

  .arrow{
    flex-shrink:0;
    font-size:18px;
    color:var(--ochre);
    font-weight:800;
    transition:transform .15s ease;
  }

  .card:hover .arrow{
    transform:translateX(4px);
  }

  footer{
    text-align:center;
    padding:24px;
    font-size:11.5px;
    color:rgba(22,61,96,.45);
  }

  @media (max-width:520px){
    header{padding:44px 20px 34px}
    main{padding:36px 18px 48px}
    .card{padding:18px 20px}
  }
</style>
</head>
<body>

<header>
  <span class="eyebrow">CdU de 0 a ÉXITO</span>
  <h1>Dossieres de operaciones</h1>
  <p>Documentación pública de las operaciones en curso. Cada dossier reúne el planteamiento, la propuesta y el estado de la operación.</p>
</header>

<main>
  <div class="list">
    <a class="card" href="tdc/">
      <div>
        <p class="card-title">Torres de Cotillas</p>
        <p class="card-sub">Dossier de la operación · plan, propuesta y cuadro de mandos</p>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</main>

<footer>
  CdU de 0 a ÉXITO
</footer>

</body>
</html>
